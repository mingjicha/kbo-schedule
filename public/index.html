<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KBO 일정</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <header class="site-header">
      <div class="header-content">
        <div class="header-title">
          <h1>⚾ KBO 경기 일정</h1>
          <p>한국야구 최고의 리그, KBO</p>
        </div>

        <input type="text" id="calendarInput" class="d-none">
      </div>
    </header>

    <div class="header-controls">
      <button id="todayBtn" class="btn-today" aria-label="최근">
        <i class="bi bi-clock-history"></i> 최근
      </button>
      <div class="year-selector">
        <button id="prevYearBtn" class="btn-year" aria-label="이전 연도">
          &lt;
        </button>
        <h2 id="yearDisplay">2026</h2>
        <button id="nextYearBtn" class="btn-year" aria-label="다음 연도">
          &gt;
        </button>
      </div>
      <button id="calendarBtn" class="btn-calendar" aria-label="달력">
        <i class="bi bi-calendar3"></i> 달력
      </button>
    </div>

    <nav class="site-nav">
      <div class="nav-content">
        <div id="monthTabsContainer" class="month-tabs-container"></div>
      </div>
    </nav>

    <aside class="filter-section">
      <div class="filter-content">
        <div class="team-filters">
          <button class="team-tab active" data-team="">전체</button>
          <button class="team-tab" data-team="LG">LG</button>
          <button class="team-tab" data-team="HH">한화</button>
          <button class="team-tab" data-team="SK">SSG</button>
          <button class="team-tab" data-team="SS">삼성</button>
          <button class="team-tab" data-team="NC">NC</button>
          <button class="team-tab" data-team="KT">KT</button>
          <button class="team-tab" data-team="LT">롯데</button>
          <button class="team-tab" data-team="HT">KIA</button>
          <button class="team-tab" data-team="OB">두산</button>
          <button class="team-tab" data-team="WO">키움</button>
        </div>
      </div>
    </aside>

    <main class="site-main">
      <div id="scheduleContainer" class="schedule-container">
        <div class="loading">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">로딩 중...</span>
          </div>
          <p>경기 일정을 불러오는 중입니다...</p>
        </div>
      </div>
    </main>

    <button id="scrollTopBtn" class="scroll-top-btn" aria-label="상단으로 이동">
      <i class="bi bi-chevron-up"></i>
    </button>
  </div>

  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-section">
        <h3>KBO 경기 일정</h3>
        <p>한국야구 최고 리그 KBO의 경기 일정을 확인하세요.</p>
      </div>

      <div class="footer-section">
        <h4><img src="/team/kbo.png" alt="KBO" class="footer-kbo-logo"></h4>
        <div class="footer-links-inline">
          <a href="https://www.koreabaseball.com/" target="_blank">KBO 공식 사이트</a>
          <a href="https://www.koreabaseball.com/Schedule/Schedule.aspx" target="_blank">KBO 경기 일정</a>
        </div>
      </div>

    </div>

    <div class="footer-bottom">
      <p>&copy; KBO 경기 일정. All rights reserved.</p>
      <p>본 사이트는 KBO 공개 데이터를 기반으로 한 비공식 서비스입니다.</p>
      <p>데이터는 제공처 사정에 따라 지연되거나 부정확할 수 있습니다. 팀 메뉴는 지난 시즌 기준으로 정렬됩니다.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
  <script src="app.js"></script>
</body>
</html>
